services:
  backend:
    build: ./backend
    restart: unless-stopped
    volumes:
      - ./data:/data          # amostras, vocabulário e modelo ficam nesta pasta
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
